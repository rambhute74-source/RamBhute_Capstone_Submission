# prometheus.yml
# Prometheus Scrape Configuration for CloudServe AI Customer Support System
# Meets Setup Guide Section 06 (Monitoring - Prometheus and Grafana)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "support-system"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "host.docker.internal:8000"
        labels:
          app: "cloudserve-support-ai"
          environment: "production"
